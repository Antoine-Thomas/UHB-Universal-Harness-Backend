# UHB provider table — copy to `uhb/config.yaml` (git-ignored).
#
# Only variable NAMES live here. No key, no token, no personal path: the adapter
# reads the value from the environment at call time, and the contract never
# carries it.
providers:
  deepseek:
    protocol: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    models: [deepseek-v4-pro, deepseek-flash]
  anthropic:
    protocol: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    models: [claude-sonnet-5, claude-haiku-4-5]
  openai:
    protocol: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    models: [gpt-5, gpt-5-mini]
  kimi:
    protocol: openai
    base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
    models: [moonshot-v1-128k]
  ollama:
    protocol: openai
    base_url: http://127.0.0.1:11434/v1
    api_key_env: OLLAMA_API_KEY  # unused by a local Ollama, kept for the shape
    models: ["qwen3:8b", "llama3.3:70b"]
  # Free tiers. Copy the variable NAME only: the value stays in the environment,
  # and a provider with no key is skipped by name rather than called (401 avoided).
  openrouter:
    protocol: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      - nvidia/nemotron-3-ultra-550b-a55b:free
      - google/gemma-4-31b-it:free
      - recursive/flint-v1.0:free
  nous:
    protocol: openai
    base_url: https://inference-api.nousresearch.com/v1
    api_key_env: NOUS_API_KEY
    models:
      - meituan/longcat-2.5:free
      - upstage/solar-mini4:free
      - stepfun/step-3.7-flash:free

# Routing: intents in, model references out. First matching rule wins, and the
# `default` is the fallback when nothing matches.
#
# `fallback` is what answers when the chosen model cannot: a reference, or a list
# of them, tried in order. `allow_paid: false` refuses a billed model (`:free`
# suffix or a loopback/`local: true` provider are free) and routes to `fallback`
# instead — `route_model` raises `PaidModelRefused` if no free candidate exists.
routing:
  default: deepseek/deepseek-v4-pro
  allow_paid: true
  rules:
    - match: {capability: fast}
      model: deepseek/deepseek-flash
    - match: {capability: code, min_context: 128000}
      model: deepseek/deepseek-v4-pro
    - match: {capability: vision}
      model: anthropic/claude-sonnet-5
    - match: {locality: local}
      model: ollama/qwen3:8b
